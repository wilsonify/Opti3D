# SonarQube project configuration
sonar.projectKey=Opti3D
sonar.projectName=Opti3D: Intelligent STL File Optimization
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.inclusions=**/*.py
sonar.exclusions=**/__pycache__/**,**/.*,**/*.pyc,**/venv/**,**/env/**

# Language settings
sonar.python.version=3.13
sonar.python.file.suffixes=.py

# Coverage settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Code analysis settings
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt

# Duplicate detection
sonar.cpd.exclusions=**/tests/**,**/*_test.py

# Size metrics
sonar.size.metric=lines

# Additional settings
sonar.sourceEncoding=UTF-8
