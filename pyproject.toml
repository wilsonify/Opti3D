[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opti3d"
version = "1.0.0"
description = "3D Printing Optimization and Security Analysis Tool"
readme = "readme.md"
license = {file = "LICENSE"}
authors = [
    {name = "Opti3D Team", email = "team@opti3d.com"}
]
maintainers = [
    {name = "Opti3D Team", email = "team@opti3d.com"}
]
keywords = ["3d-printing", "optimization", "security", "stl", "gcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "python-utils>=3.0.0",
    "numpy-stl>=2.16.0",
    "pandas>=1.5.0,<3.0.0",
    "scikit-learn>=1.1.0,<2.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "flask>=2.2.0,<3.0.0",
    "werkzeug>=2.2.0,<3.0.0",
    "flask-limiter>=3.0.0,<4.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "cryptography>=3.4.0,<4.0.0",
    "psutil>=5.8.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "pylint>=2.15.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
    "isort>=5.10.0",
    "bump2version>=1.0.0",
    "build>=0.8.0",
    "gunicorn>=20.0.0",
    "coverage>=6.0.0",
    "requests>=2.28.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "semgrep>=1.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.8.0",
    "requests>=2.28.0",
    "coverage>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/wilsonify/Opti3D"
Documentation = "https://opti3d.readthedocs.io/"
Repository = "https://github.com/wilsonify/Opti3D.git"
"Bug Tracker" = "https://github.com/wilsonify/Opti3D/issues"

[project.scripts]
opti3d = "stldeli.__main__:main"
opti3d-server = "app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stldeli", "src/templates"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stldeli*", "templates*"]

[tool.setuptools.package-data]
stldeli = ["*.json", "*.yaml", "*.yml"]
templates = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security-related tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "sklearn.*",
    "matplotlib.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0330",  # Wrong hanging indentation
    "C0326",  # Bad whitespace
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0613",  # Unused argument
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = ["B101", "B601"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".tox",
]
